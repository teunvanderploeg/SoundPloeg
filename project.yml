name: SoundPloeg
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    PRODUCT_NAME: SoundPloeg
    SWIFT_VERSION: 5.9
packages: {}
targets:
  SoundPloegCore:
    type: framework
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/SoundPloegCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: SoundPloegCore
        PRODUCT_MODULE_NAME: SoundPloegCore
  SoundPloegApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/SoundPloegApp
    dependencies:
      - target: SoundPloegCore
      - target: SoundPloegInfra
    settings:
      base:
        INFOPLIST_FILE: Config/AppInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        PRODUCT_BUNDLE_IDENTIFIER: com.soundploeg.app
        PRODUCT_NAME: SoundPloeg
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - SoundPloegCoreTests
        - SoundPloegIntegrationTests
  SoundPloegInfra:
    type: framework
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/SoundPloegInfra
        excludes:
          - Resources
      - path: Sources/SoundPloegInfra/Resources/model_catalog.json
        buildPhase: resources
      - path: Sources/SoundPloegInfra/Resources/Runtime
        type: folder
        buildPhase: resources
    dependencies:
      - target: SoundPloegCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: SoundPloegInfra
        PRODUCT_MODULE_NAME: SoundPloegInfra
  SoundPloegCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/SoundPloegCoreTests
    dependencies:
      - target: SoundPloegCore
  SoundPloegIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Tests/SoundPloegIntegrationTests
    dependencies:
      - target: SoundPloegCore
      - target: SoundPloegInfra
